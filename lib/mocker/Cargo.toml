[package]
name = "dynamo-mocker"
description = "Mock LLM scheduler and KV manager for testing"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = ["router-runtime", "zmq-events"]
profile = []
aic-forward-pass = ["dep:aiconfigurator-core"]
# Keep Dynamo's normal metrics/runtime-enabled router while allowing pure
# in-process consumers to opt out with `default-features = false`.
router-runtime = ["dynamo-kv-router/metrics", "dynamo-kv-router/runtime-protocols"]
# The embedded steppable engine has no event socket; normal Dynamo builds keep
# the existing publisher API through this default feature.
zmq-events = ["dep:tmq"]
# Enables G1↔G2 offload simulation via kvbm-engine.
kvbm-offload = ["dep:kvbm-engine", "dep:kvbm-physical", "dep:kvbm-common", "dep:velo"]

[dependencies]
# repo
dynamo-data-gen = { workspace = true }
# Not `workspace = true`: the workspace entry bakes in `metrics` +
# `runtime-protocols`, which an inherited dep cannot remove, and pure in-process
# consumers need `default-features = false`. `version` must track the workspace
# version (`version.workspace = true` in ../kv-router) on every bump.
dynamo-kv-router = { path = "../kv-router", version = "1.3.0" }
dynamo-tokens = { workspace = true }
kvbm-logical = { workspace = true }

# kvbm-offload feature dependencies (G1↔G2 transport simulation)
kvbm-engine = { workspace = true, optional = true }
kvbm-physical = { workspace = true, optional = true }
kvbm-common = { workspace = true, optional = true }
velo = { workspace = true, optional = true }

# workspace
aiconfigurator-core = { workspace = true, optional = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
derive_builder = { workspace = true }
derive-getters = { workspace = true }
futures = { workspace = true }
indicatif = "0.18"
rand = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
tmq = { workspace = true, optional = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
validator = { workspace = true }

# crate-specific
ndarray = "0.16"
slotmap = "1"
ndarray-npy = "0.9"
ndarray-interp = "0.5"
rustc-hash = "2"

[target.'cfg(target_os = "linux")'.dependencies]
tokio-timerfd = "0.2"

[dev-dependencies]
dynamo-kv-router = { path = "../kv-router", version = "1.3.0", features = ["metrics", "runtime-protocols"] }
rstest = "0.18.2"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
